<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoopFace</title>
<meta name="robots" content="noindex">
<script>
  // Preserve links from both previous repository spellings.
  // Keep the rest of the path, the query and the hash.
  (function () {
    var oldRoots = ['/agent-robot-avatar', '/boopface'];
    var p = location.pathname;
    for (var i = 0; i < oldRoots.length; i++) {
      var old = oldRoots[i];
      if (p === old || p.indexOf(old + '/') === 0) {
        location.replace('/BoopFace' + p.slice(old.length) + location.search + location.hash);
        return;
      }
    }
  })();
</script>
